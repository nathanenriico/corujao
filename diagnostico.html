<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Diagnóstico — Adega Corujão</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: monospace; background: #0f1117; color: #e8eaf0; padding: 24px; }
    h2 { color: #00a99d; margin: 20px 0 8px; }
    .ok  { color: #22c55e; }
    .err { color: #ef4444; }
    .warn{ color: #eab308; }
    pre  { background: #1a1d27; padding: 12px; border-radius: 8px; white-space: pre-wrap; word-break: break-all; font-size: 13px; }
    button { background: #00a99d; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; margin: 8px 4px 0 0; }
    button:hover { background: #008f85; }
  </style>
</head>
<body>
<h1>🔍 Diagnóstico Adega Corujão</h1>
<p>Abre esta página, clica em "Rodar diagnóstico" e mostra o resultado para o suporte.</p>

<button onclick="rodar()">▶ Rodar diagnóstico</button>
<button onclick="location.href='index.html'">← Voltar ao sistema</button>

<div id="out"></div>

<script>
const SUPABASE_URL = 'https://fykqqioozgotmmebtlix.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ5a3FxaW9vemdvdG1tZWJ0bGl4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1NjYyNTksImV4cCI6MjA5NzE0MjI1OX0.ZWw5GvAcYNFCAlOcDLINE2Pi8g4SToBlPMmzg2NuTA8';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function log(html) {
  document.getElementById('out').innerHTML += html + '\n';
}
function ok(msg)  { log(`<p class="ok">✅ ${msg}</p>`); }
function err(msg) { log(`<p class="err">❌ ${msg}</p>`); }
function warn(msg){ log(`<p class="warn">⚠️ ${msg}</p>`); }
function h(msg)   { log(`<h2>${msg}</h2>`); }

async function rodar() {
  document.getElementById('out').innerHTML = '';
  h('1. Conexão com Supabase');
  try {
    const { data, error } = await db.from('produtos').select('count').limit(1);
    if (error) err('Falha ao conectar: ' + error.message);
    else ok('Supabase conectado');
  } catch(e) { err('Exceção: ' + e.message); }

  h('2. Colunas da tabela produtos');
  try {
    const { data, error } = await db.from('produtos').select('*').limit(3);
    if (error) { err('Erro ao ler produtos: ' + error.message); }
    else if (!data || data.length === 0) {
      warn('Tabela produtos está vazia — sem como verificar colunas');
    } else {
      const cols = Object.keys(data[0]);
      log('<pre>' + cols.join('\n') + '</pre>');
      if (cols.includes('combo_config')) ok('combo_config existe ✔');
      else err('combo_config NÃO existe — execute migracao_pdv.sql no Supabase!');

      // Mostra quais produtos têm combo_config preenchido
      const combos = data.filter(p => p.combo_config && p.combo_config.groups?.length > 0);
      const todos = await db.from('produtos').select('id,nome,combo_config').eq('status','ativo');
      const todosCombo = (todos.data || []).filter(p => p.combo_config?.groups?.length > 0);
      if (todosCombo.length === 0) {
        warn('Nenhum produto tem grupos de combo configurados ainda. Edite um produto, marque "Combo personalizável", adicione grupos e salve.');
      } else {
        ok('Produtos com combo configurado:');
        todosCombo.forEach(p => log(`<pre>  ${p.nome}: ${JSON.stringify(p.combo_config)}</pre>`));
      }
    }
  } catch(e) { err('Exceção: ' + e.message); }

  h('3. Colunas da tabela itens_venda');
  try {
    const { data, error } = await db.from('itens_venda').select('*').limit(1);
    if (error) { warn('Sem itens de venda ou erro: ' + error.message); }
    else if (!data || data.length === 0) {
      warn('Tabela itens_venda está vazia');
      // tenta via vendas
      const { data: v } = await db.from('vendas').select('*,itens_venda(*)').limit(1);
      if (v?.[0]?.itens_venda?.[0]) {
        const cols = Object.keys(v[0].itens_venda[0]);
        if (cols.includes('componentes')) ok('componentes existe ✔');
        else err('componentes NÃO existe em itens_venda — execute migracao_pdv.sql!');
      }
    } else {
      const cols = Object.keys(data[0]);
      log('<pre>' + cols.join('\n') + '</pre>');
      if (cols.includes('componentes')) ok('componentes existe ✔');
      else err('componentes NÃO existe — execute migracao_pdv.sql!');
    }
  } catch(e) { err('Exceção: ' + e.message); }

  h('4. Colunas da tabela vendas');
  try {
    const { data, error } = await db.from('vendas').select('*').limit(1);
    if (error) { warn('Sem vendas ou erro: ' + error.message); }
    else if (!data || data.length === 0) { warn('Tabela vendas está vazia'); }
    else {
      const cols = Object.keys(data[0]);
      log('<pre>' + cols.join('\n') + '</pre>');
      if (cols.includes('chave_pdv')) ok('chave_pdv existe ✔');
      else err('chave_pdv NÃO existe — execute migracao_pdv.sql!');
    }
  } catch(e) { err('Exceção: ' + e.message); }

  h('5. Função finalizar_venda_pdv');
  try {
    // Tenta chamar com dados inválidos — se retornar erro de "Faça login" ou "inválido" a função existe
    const { data, error } = await db.rpc('finalizar_venda_pdv', {
      p_chave: '00000000-0000-0000-0000-000000000000',
      p_pagamento: 'pix',
      p_itens: [{ product_id: '00000000-0000-0000-0000-000000000000', quantity: 1, components: [] }]
    });
    if (error) {
      const msg = error.message || '';
      if (msg.includes('login') || msg.includes('inválid') || msg.includes('indisponível') || msg.includes('Produto') || msg.includes('authenticated')) {
        ok('Função existe (erro esperado: "' + msg.slice(0, 80) + '")');
      } else if (msg.includes('does not exist') || msg.includes('não existe')) {
        err('Função finalizar_venda_pdv NÃO existe — execute migracao_pdv.sql!');
      } else {
        warn('Retornou: ' + msg.slice(0, 120));
      }
    } else {
      ok('Função existe e retornou: ' + JSON.stringify(data));
    }
  } catch(e) { err('Exceção: ' + e.message); }

  h('6. Autenticação');
  try {
    const { data: { session } } = await db.auth.getSession();
    if (session?.user) ok('Usuário logado: ' + session.user.email);
    else warn('Sem sessão — vendas precisam de login para funcionar');
  } catch(e) { err('Exceção: ' + e.message); }

  h('— Diagnóstico concluído —');
}
</script>
</body>
</html>
